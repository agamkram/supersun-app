# Daily SuperSun bake. GitHub runners:
#   1) sliding Carrington frames — `python3 scripts/build-171-movie.py --no-mp4`
#      (bake day back ~27 days → frames/ + frames.json; Live/When follow this window)
#   2) globe surface — `python3 scripts/build-171.py --sdo` → sun-2k.jpg
# Vercel deploys from main when those files / cache-bust queries change.
#
# Kickoff ~9:47 America/New_York (after 12:00 UTC SDO; staggered after
# GlobalFlows 8:47, Heat 9:17, Orbital View 9:23). Odd minute to reduce
# Actions :00/:30 queue delay. timezone keeps ET through DST. Actions
# cron can still drift; workflow_dispatch remains for manual / dry_run.
#
# Email (optional): repo Actions secrets —
#   BAKE_NOTIFY_TO   your inbox
#   BAKE_SMTP_HOST   e.g. smtp.gmail.com
#   BAKE_SMTP_PORT   587
#   BAKE_SMTP_USER   SMTP login (usually the Gmail address)
#   BAKE_SMTP_PASS   app password (not the normal Gmail password)
# Without mail secrets the bake still ships; before/after is always in the job summary.
name: Sun bake

on:
  schedule:
    - cron: "47 9 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Bake without committing or pushing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: supersun-surface
  cancel-in-progress: false

jobs:
  bake:
    name: Bake Carrington + surface
    runs-on: ubuntu-latest
    # Cold cache can take a while; warm movie-1h cache is mostly today's new hours.
    timeout-minutes: 360
    env:
      TZ: America/New_York
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      BAKE_NOTIFY_TO: ${{ secrets.BAKE_NOTIFY_TO }}
      BAKE_SMTP_HOST: ${{ secrets.BAKE_SMTP_HOST }}
      BAKE_SMTP_PORT: ${{ secrets.BAKE_SMTP_PORT }}
      BAKE_SMTP_USER: ${{ secrets.BAKE_SMTP_USER }}
      BAKE_SMTP_PASS: ${{ secrets.BAKE_SMTP_PASS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore SDO / movie frame cache
        uses: actions/cache@v4
        with:
          path: .sun-cache
          key: sun-frames-${{ github.run_id }}
          restore-keys: |
            sun-frames-

      - name: Install dependencies
        run: pip install pillow numpy

      - name: Snapshot before
        run: |
          set -euo pipefail
          python3 scripts/bump-version.py --check > /tmp/sun-before-v.txt
          wc -c < sun-2k.jpg | tr -d ' ' > /tmp/sun-before-bytes.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("frames.json").read_text())
          Path("/tmp/sun-before-frames.txt").write_text(
              f"{meta.get('start','?')} → {meta.get('end','?')} ({meta.get('count','?')} frames)\n"
          )
          PY

      - name: Bake sliding Carrington frames
        id: frames
        continue-on-error: true
        run: |
          set -euo pipefail
          if python3 scripts/build-171-movie.py --no-mp4 2>&1 | tee /tmp/sun-frames.log; then
            echo "Frames bake succeeded."
          else
            echo "Frames bake exited non-zero. Retrying once..."
            python3 scripts/build-171-movie.py --no-mp4 2>&1 | tee /tmp/sun-frames.log
          fi

      - name: Bake AIA 171 surface
        id: surface
        if: steps.frames.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if python3 scripts/build-171.py --sdo 2>&1 | tee /tmp/sun-surface.log; then
            echo "Surface bake succeeded."
          else
            echo "Surface bake exited non-zero. Retrying once..."
            python3 scripts/build-171.py --sdo 2>&1 | tee /tmp/sun-surface.log
          fi

      - name: Write before/after report
        id: report
        if: always()
        run: |
          set -euo pipefail
          before_v="$(cat /tmp/sun-before-v.txt 2>/dev/null || echo unknown)"
          before_b="$(cat /tmp/sun-before-bytes.txt 2>/dev/null || echo 0)"
          before_f="$(cat /tmp/sun-before-frames.txt 2>/dev/null | tr -d '\n' || echo unknown)"
          if [ -f sun-2k.jpg ]; then
            after_b="$(wc -c < sun-2k.jpg | tr -d ' ')"
          else
            after_b=0
          fi
          after_v="$(python3 scripts/bump-version.py --check 2>/dev/null || echo unknown)"
          after_f="$(python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("frames.json")
          if not p.exists():
              print("missing")
          else:
              meta = json.loads(p.read_text())
              print(f"{meta.get('start','?')} → {meta.get('end','?')} ({meta.get('count','?')} frames)")
          PY
          )"
          covered="$(grep -E '^covered ' /tmp/sun-surface.log 2>/dev/null | tail -1 || true)"
          window="$(grep -E '^covered window ' /tmp/sun-frames.log 2>/dev/null | tail -1 || true)"
          wrote="$(grep -E '^wrote ' /tmp/sun-surface.log 2>/dev/null | tail -1 || true)"
          frames_ok="${{ steps.frames.outcome }}"
          surface_ok="${{ steps.surface.outcome }}"
          {
            if [ "$frames_ok" != "success" ]; then
              echo "SuperSun bake · FAIL"
              echo
              echo "Carrington frames bake failed. Yesterday's loop stays."
            elif [ "$surface_ok" != "success" ]; then
              echo "SuperSun bake · PARTIAL"
              echo
              echo "Frames ok; surface failed. New loop ships; yesterday's globe texture stays."
            else
              echo "SuperSun bake · SUCCESS"
              echo
            fi
            echo "version ${before_v} → ${after_v}"
            echo "frames ${before_f}"
            echo "     → ${after_f}"
            [ -n "${window}" ] && echo "${window}"
            echo "sun-2k.jpg ${before_b} → ${after_b} bytes"
            [ -n "${covered}" ] && echo "${covered}"
            [ -n "${wrote}" ] && echo "${wrote}"
            echo
            echo "Run: ${GITHUB_RUN_URL}"
          } | tee /tmp/bake-report.txt
          {
            echo '```'
            cat /tmp/bake-report.txt
            echo '```'
          } > /tmp/bake-report.md
          cat /tmp/bake-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Require Carrington frames
        id: gate
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.frames.outcome }}" != "success" ]; then
            echo "::error::Sun Carrington frames bake failed."
            exit 1
          fi
          echo "Frames bake succeeded."

      - name: Commit and push bake files
        id: commit
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # frames/ may gain or lose plates when the window slides
          git add -A -- frames
          git add -- \
            frames.json \
            carrington-171-poster.jpg \
            movie.json \
            sun-2k.jpg \
            surface.json \
            index.html \
            sun.js

          if git diff --cached --quiet; then
            echo "No bake file changes — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          extra="$(git diff --cached --name-only | grep -v \
            -e '^frames/' \
            -e '^frames\.json$' \
            -e '^carrington-171-poster\.jpg$' \
            -e '^movie\.json$' \
            -e '^sun-2k\.jpg$' \
            -e '^surface\.json$' \
            -e '^index\.html$' \
            -e '^sun\.js$' \
            || true)"
          if [ -n "${extra}" ]; then
            echo "::error::Refusing to commit unexpected staged files:"
            echo "${extra}"
            exit 1
          fi

          date_label="$(LC_TIME=C date '+%-d %b %Y')"
          git commit -m "Refresh SuperSun Carrington bake for ${date_label}."
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry run — skip commit
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo "Dry run — bake finished; no commit or push."

      - name: Mail before/after report
        if: ${{ always() && steps.report.outcome == 'success' && env.BAKE_NOTIFY_TO != '' && env.BAKE_SMTP_HOST != '' && env.BAKE_SMTP_USER != '' && env.BAKE_SMTP_PASS != '' }}
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: ${{ env.BAKE_SMTP_HOST }}
          server_port: ${{ env.BAKE_SMTP_PORT != '' && env.BAKE_SMTP_PORT || 587 }}
          secure: false
          username: ${{ env.BAKE_SMTP_USER }}
          password: ${{ env.BAKE_SMTP_PASS }}
          subject: ${{ steps.gate.outcome == 'success' && (steps.surface.outcome == 'success' && 'SuperSun bake · SUCCESS' || 'SuperSun bake · PARTIAL') || 'SuperSun bake · FAIL' }}
          to: ${{ env.BAKE_NOTIFY_TO }}
          from: SuperSun bake <${{ env.BAKE_SMTP_USER }}>
          body: file:///tmp/bake-report.txt
          html_body: file:///tmp/bake-report.md

      - name: Note when mail secrets are missing
        if: ${{ always() && (env.BAKE_NOTIFY_TO == '' || env.BAKE_SMTP_HOST == '' || env.BAKE_SMTP_USER == '' || env.BAKE_SMTP_PASS == '') }}
        run: |
          echo "Mail skipped — add BAKE_NOTIFY_TO, BAKE_SMTP_HOST, BAKE_SMTP_PORT (587), BAKE_SMTP_USER, BAKE_SMTP_PASS under Settings → Secrets → Actions. Report is in the job summary."
