  <script>
    /* iOS A2HS: lock fill height before first paint.
       Phone: screen.height > inner → use screen.
       iPad: screen.* often *undershoots* inner → add safe-area extra. */
    (function () {
      var n = window.navigator;
      var standalone =
        n.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches;
      if (!standalone) return;
      var root = document.documentElement;
      root.classList.add("pwa-standalone");
      var iw = window.innerWidth || 0;
      var ih = window.innerHeight || 0;
      var sw = window.screen.width || 0;
      var sh = window.screen.height || 0;
      var screenMax = Math.max(sw, sh);
      var screenMin = Math.min(sw, sh);
      var fillH = ih >= iw ? Math.max(ih, screenMax) : Math.max(ih, screenMin);
      var extra = 0;
      if (Math.min(iw, ih) >= 600 && screenMax < ih - 10) {
        extra = 20; /* refined to real insetB once body exists */
      }
      root.style.setProperty("--pwa-fill-h", fillH + "px");
      root.style.setProperty("--pwa-extra-b", extra + "px");
    })();
    /* Tablet class before first paint so the bottom lift does not flash in. */
    (function () {
      var minSide = Math.min(window.innerWidth || 0, window.innerHeight || 0);
      if (minSide < 600) return;
      var touch = (navigator.maxTouchPoints || 0) > 1;
      var coarse = window.matchMedia("(pointer: coarse)").matches;
      var noHover = window.matchMedia("(hover: none)").matches;
      if (touch || coarse || noHover) document.documentElement.classList.add("is-tablet");
    })();
  </script>

  <style>
    :root {
      color-scheme: dark;
      --text: #e8f4fc;
      --muted: #7eb8d8;
      --dim: #6aa8cc;
      --faint: #4a88a8;
      --cell: transparent;
      --panel: rgba(18, 22, 30, 0.58);
      --line: rgba(42, 49, 64, 0.65);
      --hi: #c8d0e0;
      --mono: "Inter", system-ui, sans-serif;
      --font: "Inter", system-ui, sans-serif;
      /* Compact instrument labels */
      --label-size: 8px;
      /* iPad only: lift controls off the bottom edge that switches apps. */
      --ipad-gesture-lift: 0px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background: #020308;
      color: var(--text);
      font-family: var(--font);
      -webkit-text-size-adjust: 100%;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /*
     * Full-bleed GL stack. Do NOT use max-height:100dvh — undershoots on iOS.
     * Safari: env() overpaint. Home-screen PWA: height locked to screen (see JS)
     * because innerHeight stays short of screen.height and clips env() overshoot.
     */
    #stage,
    #sun-host,
    #touch-plane {
      position: fixed;
      top: calc(-1 * env(safe-area-inset-top, 0px));
      right: calc(-1 * env(safe-area-inset-right, 0px));
      bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
      left: calc(-1 * env(safe-area-inset-left, 0px));
    }

    html.pwa-standalone,
    html.pwa-standalone body {
      height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
      min-height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
    }

    html.pwa-standalone #stage,
    html.pwa-standalone #sun-host,
    html.pwa-standalone #touch-plane {
      top: 0;
      right: 0;
      bottom: auto;
      left: 0;
      width: 100%;
      height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
    }

    /* Clips the oversized GL canvas; black matches clear color */
    #sun-host {
      z-index: 1;
      overflow: hidden;
      background: #020308;
    }

    /* Gesture layer above canvas, under real UI controls */
    #touch-plane {
      z-index: 2;
      touch-action: none;
      background: transparent;
    }

    #sun-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.2s ease;
      background: #020308;
    }

    #sun-canvas.is-ready { opacity: 1; }
    /* PWA: no fade — opacity pop reads as a flash on open */
    html.pwa-standalone #sun-canvas {
      transition: none;
    }
    #sun-canvas:active { cursor: grabbing; }

    .chrome {
      position: fixed;
      z-index: 4;
      left: 0;
      right: 0;
      top: 0;
      height: calc(0.375in + env(safe-area-inset-top, 0px));
      padding:
        env(safe-area-inset-top, 0px)
        max(1rem, env(safe-area-inset-right))
        0
        max(1rem, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
    }

    /* Same title treatment as Solar Dashboard (Michroma), CamelCase */
    .app-title {
      margin: 0;
      font-family: "Michroma", var(--font), system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(1.05rem, 3.2vmin, 1.35rem); /* match LightSlice title */
      letter-spacing: 0.1em;
      line-height: 1.15;
      color: var(--text);
      text-align: center;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
    }

    /*
     * Bottom metrics: one quiet panel, compact instrument rows.
     * pointer-events:none on shell — only controls capture so 2fs works over empty areas.
     * The Sun zooms over this; un-zoom / Live to use the controls.
     */
    html.is-tablet {
      --ipad-gesture-lift: 0.5in;
    }

    .loc-bar {
      position: fixed;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: var(--ipad-gesture-lift, 0px);
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding:
        0.1rem
        max(0.3rem, env(safe-area-inset-right))
        max(0.3rem, env(safe-area-inset-bottom, 0px))
        max(0.3rem, env(safe-area-inset-left));
      background: transparent;
      pointer-events: none;
      touch-action: none;
      display: flex;
      flex-direction: column;
      gap: 0.12rem;
    }

    .loc-bar input,
    .loc-bar button {
      pointer-events: auto;
      touch-action: manipulation;
    }

    :root {
      --m-row-h: 1.7rem;
      --m-cell-pad: 2px 0.4rem;
      --m-cell-gap: 1px;
    }

    .metrics-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.18rem 0.14rem;
      display: flex;
      flex-direction: column;
      gap: 0.06rem;
      pointer-events: none;
    }

    .m-grid {
      display: grid;
      /* Carrington · Dist · Size · When · Live */
      grid-template-columns: 1.15fr 1.05fr 0.85fr 1.55fr 0.75fr;
      grid-auto-rows: var(--m-row-h);
      gap: 0;
      pointer-events: none;
    }

    .m-cell-when {
      pointer-events: none;
    }

    .m-cell-live {
      padding: 1px;
      justify-content: center;
      align-items: stretch;
      pointer-events: auto;
    }

    .m-cell-live .live-btn {
      width: 100%;
      height: 100%;
      min-height: 0;
      border-radius: 4px;
      padding: 0 0.25rem;
      font-size: 9px;
    }

    /* Space weather: X-ray + R·S·G a touch wider */
    .m-grid-3 {
      grid-template-columns:
        minmax(0, 1.15fr)
        minmax(0, 1.35fr)
        minmax(0, 0.85fr)
        minmax(0, 1.1fr)
        minmax(0, 1fr);
      grid-auto-rows: var(--m-row-h);
      gap: 0;
    }

    /* Rise / noon / set / day length + tool strip */
    .m-grid-rise {
      grid-template-columns:
        minmax(0, 0.78fr) minmax(0, 0.78fr) minmax(0, 0.78fr) minmax(0, 0.9fr)
        minmax(6.8rem, 1.1fr);
      grid-auto-rows: var(--m-row-h);
      align-items: stretch;
      gap: 0;
    }

    .tool-strip {
      display: flex;
      align-items: stretch;
      gap: 1px;
      min-width: 6.8rem;
      width: 100%;
      padding: 1px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: none;
      pointer-events: auto;
    }

    #m-xray,
    #m-scales {
      font-size: 11px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vision-btn {
      flex: 1 1 auto;
      min-width: 2.7rem;
      height: 100%;
      min-height: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--dim);
      font-family: var(--font);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
      line-height: 1;
      padding: 0 0.45rem;
      -webkit-tap-highlight-color: transparent;
    }


    /* On only — no hover “third” look */
    .vision-btn[aria-pressed="true"] {
      background: rgba(232, 244, 252, 0.18);
      color: var(--text);
    }




    body.is-red-mode .vision-btn {
      background: transparent;
      color: var(--dim);
    }

    body.is-red-mode .vision-btn[aria-pressed="true"] {
      background: rgba(200, 28, 36, 0.55);
      color: var(--text);
    }

    .m-cell {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: var(--m-cell-pad);
      min-width: 0;
      min-height: var(--m-row-h);
      height: var(--m-row-h);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: var(--m-cell-gap);
      overflow: hidden;
    }

    .m-grid > .m-cell + .m-cell,
    .m-grid-3 > .m-cell + .m-cell,
    .m-grid-rise > .m-cell + .m-cell {
      box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.05);
    }

    button.m-cell-fact {
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      width: 100%;
    }

    button.m-cell-fact:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .m-cell .k {
      font-size: var(--label-size);
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.1;
      flex: 0 0 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    .m-cell .v {
      font-family: var(--font);
      font-weight: 600;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 0 auto;
      min-width: 0;
    }

    .m-cell .v.sm { font-size: 11px; }
    .m-cell .v.hi {
      color: var(--hi);
      font-size: 11px;
      letter-spacing: -0.015em;
    }

    /*
     * Tablets (iPad and similar): phone landscape is excluded via min-height.
     * Coarse pointer + both sides ≥600px ≈ tablet class across platforms.
     */
    @media (pointer: coarse) and (min-width: 600px) and (min-height: 600px) {
      :root {
        --m-row-h: 2rem;
        --m-cell-pad: 3px 0.45rem;
        --m-cell-gap: 1px;
        --label-size: 9px;
      }

      .loc-bar {
        max-width: 620px;
        gap: 0.16rem;
        padding-left: max(0.55rem, env(safe-area-inset-left));
        padding-right: max(0.55rem, env(safe-area-inset-right));
      }

      .metrics-panel {
        border-radius: 12px;
        padding: 0.22rem 0.18rem;
        gap: 0.08rem;
      }

      .m-grid {
        grid-template-columns: 1.15fr 1.05fr 0.85fr 1.55fr 0.75fr;
      }

      .m-cell-live .live-btn {
        font-size: 10px;
      }

      .m-grid-3 {
        grid-template-columns:
          minmax(0, 1.15fr)
          minmax(0, 1.35fr)
          minmax(0, 0.85fr)
          minmax(0, 1.1fr)
          minmax(0, 1fr);
      }

      .m-cell .k {
        letter-spacing: 0.03em;
      }

      .m-cell .v,
      .m-cell .v.sm,
      .m-cell .v.hi {
        font-size: 13px;
      }

      #m-xray,
      #m-scales {
        font-size: 11px;
      }

      .m-grid-rise {
        grid-template-columns:
          minmax(0, 0.78fr) minmax(0, 0.78fr) minmax(0, 0.78fr) minmax(0, 0.9fr)
          minmax(7.4rem, 1.1fr);
      }

      .vision-btn {
        font-size: 10px;
        min-width: 2.8rem;
        padding: 0 0.45rem;
      }


      .live-btn {
        font-size: 11px;
        min-height: 1.4rem;
        padding: 0 0.55rem;
      }
    }

    /*
     * Phone landscape only (short height). iPad landscape is taller (≥600px)
     * and keeps the normal / tablet layouts. Shrink stats so the Sun stays visible.
     */
    @media (orientation: landscape) and (max-height: 500px) {
      .chrome {
        height: calc(0.28in + env(safe-area-inset-top, 0px));
      }

      .app-title {
        font-size: 0.16in;
      }

      .loc-bar {
        max-width: min(620px, 96vw);
        gap: 0.06rem;
        padding-top: 0.06rem;
        /* zoom reduces used layout height on iOS (transform would not) */
        zoom: 0.72;
      }

      :root {
        --m-row-h: 1.35rem;
        --m-cell-pad: 1px 0.28rem;
        --m-cell-gap: 0;
        --label-size: 6.5px;
      }

      .metrics-panel {
        gap: 0.06rem;
      }

      .m-cell .v,
      .m-cell .v.sm,
      .m-cell .v.hi {
        font-size: 9px;
      }

      .vision-btn {
        font-size: 7px;
        min-width: 2rem;
        padding: 0 0.25rem;
      }
    }

    body.is-red-mode button.m-cell-fact:active {
      background: rgba(40, 4, 4, 0.55);
    }

    /* Fact sheet outside .loc-bar so full-screen overlay receives taps */
    .fact-sheet {
      position: fixed;
      z-index: 20;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(0.75rem, env(safe-area-inset-top))
        max(0.75rem, env(safe-area-inset-right))
        max(0.75rem, env(safe-area-inset-bottom))
        max(0.75rem, env(safe-area-inset-left));
      background: transparent;
      pointer-events: auto;
      touch-action: manipulation;
    }

    .fact-sheet[hidden] {
      display: none !important;
    }

    /* Real button behind the card — iOS won't reliably click empty overlay divs */
    .fact-sheet-scrim {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .fact-sheet-inner {
      position: relative;
      z-index: 1;
      width: min(320px, 100%);
      padding: 12px 40px 12px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(12, 16, 24, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: none;
      pointer-events: auto;
    }

    .fact-sheet-inner h2 {
      font-family: var(--font);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 0 6px;
      padding-right: 4px;
      color: var(--text);
      text-shadow: 0 1px 8px #000;
    }

    .fact-sheet-inner p {
      font-size: 12px;
      line-height: 1.35;
      color: var(--text);
      margin: 0;
      white-space: normal;
      text-shadow: 0 1px 8px #000;
    }

    .fact-sheet-close {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 36px;
      height: 36px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      font: 22px/1 var(--font);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    body.is-red-mode .fact-sheet-inner {
      background: rgba(10, 0, 0, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-color: #3a0c0c;
    }

    body.is-red-mode .fact-sheet-close {
      background: transparent;
      color: var(--text);
    }


    .live-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.28rem 0.55rem;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: auto;
      touch-action: manipulation;
      line-height: 1.1;
      white-space: nowrap;
      z-index: 2;
    }

    .live-btn.is-preview {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.28);
    }



    .status {
      position: fixed;
      z-index: 2;
      left: 0;
      right: 0;
      top: calc(0.45in + env(safe-area-inset-top, 0px));
      text-align: center;
      pointer-events: none;
      font-size: 0.65rem;
      color: var(--muted);
      opacity: 0.65;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
    }

    /*
     * Night vision: kill white / bright UI so dark-adapted eyes survive.
     * App stays fully usable. Tap the Sun (or the badge) to toggle.
     */
    body.is-red-mode {
      --text: #c81820;
      --muted: #9a1018;
      --dim: #7a0c10;
      --faint: #4a0608;
      --cell: rgba(12, 0, 0, 0.58);
      --line: #4a0808;
      --hi: #e02028;
      --panel: rgba(10, 0, 0, 0.94);
      background: #030000;
      color: var(--text);
      color-scheme: dark;
    }

    body.is-red-mode #sun-host,
    body.is-red-mode #stage {
      background: #030000;
    }

    /* Deeper blood cast on the globe */
    body.is-red-mode #sun-host {
      filter: sepia(1) hue-rotate(-48deg) saturate(6.2) brightness(0.38) contrast(1.08);
    }

    body.is-red-mode .loc-bar {
      background: transparent;
    }

    body.is-red-mode .metrics-panel {
      border-color: #3a0c0c;
      background: rgba(40, 4, 4, 0.45);
    }

    body.is-red-mode .live-btn,
    body.is-red-mode .edit-panel button,
    body.is-red-mode .edit-panel input {
      background: rgba(40, 4, 4, 0.55);
      border-color: #3a0c0c;
      color: var(--text);
      accent-color: #6a1010;
    }

    body.is-red-mode .live-btn.is-preview {
      background: rgba(70, 10, 10, 0.55);
      border-color: #551010;
    }

    body.is-red-mode .app-title {

  <script src="astronomy.js"></script>
  <script type="module">
    import { createSunGlobe } from "./sun.js?v=101";

    const STORAGE_KEY = "sun-globe-loc-v1";
    const DEFAULT_LOC = { lat: 35.5956, lon: -82.5519, name: "Asheville, NC" };
    const ROTATION_DAYS = 27.2753;
    const SUN_RADIUS_KM = 695700;
    const MI_PER_KM = 0.621371;

    const canvas = document.getElementById("sun-canvas");
    const status = document.getElementById("status");
    const cycleDate = document.getElementById("cycle-date");
    const liveBtn = document.getElementById("live-btn");

    const el = {
      cycle: document.getElementById("m-cycle"),
      dist: document.getElementById("m-dist"),
      size: document.getElementById("m-size"),
      xray: document.getElementById("m-xray"),
      scales: document.getElementById("m-scales"),
      kp: document.getElementById("m-kp"),
      wind: document.getElementById("m-wind"),
      protons: document.getElementById("m-protons"),
      rise: document.getElementById("m-rise"),
      high: document.getElementById("m-high"),
      set: document.getElementById("m-set"),
      daylen: document.getElementById("m-daylen"),
    };


    const FACTS = {
      cycle: {
        title: "Carrington",
        body: "One rotation of the Sun as seen from Earth, about 27.3 days. The count is days into the current rotation. Swipe the Sun to walk that rotation; Live is today. The far side of the globe is the face that was toward us weeks ago.",
      },
      dist: {
        title: "Distance",
        body: "How far Earth is from the Sun. One Astronomical Unit is the average. Closest in early January, farthest in early July.",
      },
      size: {
        title: "Size",
        body: "How wide the Sun looks. An arcminute is 1/60 of a degree. It is usually about 32′ across, a bit larger in January when Earth is closer.",
      },
      rise: {
        title: "Sunrise",
        body: "Local time when the Sun's upper edge crosses the horizon on the way up. It shifts through the year, and with where you sit inside the time zone.",
      },
      high: {
        title: "Solar noon",
        body: "When the Sun is highest today. That is solar noon, not always 12:00. A time zone covers many longitudes, and Earth's oval orbit and tilt shift solar noon by up to about 16 minutes through the year.",
      },
      set: {
        title: "Sunset",
        body: "Local time when the Sun's upper edge drops below the horizon. It shifts through the year, opposite sunrise.",
      },
      daylen: {
        title: "Day length",
        body: "Hours from sunrise to sunset. Longest near the June solstice, shortest near the December solstice. Near the poles the Sun can stay up, or down, all day.",
      },
      xray: {
        title: "X-ray",
        body: "Soft X-rays from the hot corona, measured by GOES in geostationary orbit. Classes A, B, C, M, and X each step up by ten. A–C are common. M and X are strong flares.",
      },
      scales: {
        title: "R·S·G",
        body: "NOAA scales, 0 quiet to 5 extreme. R (radio): X-rays black out the day side. S (radiation): fast protons risk satellites and polar flights. G (geomagnetic): solar wind couples to Earth's magnetosphere, spreading aurora equatorward and stressing grids and satellites.",
      },
      kp: {
        title: "Kp",
        body: "How disturbed Earth's magnetic field is, on a 0–9 scale, from magnetometers around the world. 0–2 is quiet. 5 and above is a geomagnetic storm. NOAA updates it about once a minute.",
      },
      wind: {
        title: "Solar wind",
        body: "Protons and electrons from the corona. Typical is about 250 mi/s (400 km/s). DSCOVR or ACE measures it at L1, a million miles sunward of Earth, 15–60 minutes before it interacts with Earth's magnetosphere.",
      },
      protons: {
        title: "Protons",
        body: "Fast protons above 10 MeV, counted by GOES. The number is how many pass through a square centimeter each second. Quiet is well under 1. NOAA's S-scale radiation storm starts near 10.",
      },
    };

    const factSheet = document.getElementById("fact-sheet");
    const factTitle = document.getElementById("fact-title");
    const factBody = document.getElementById("fact-body");
    const factClose = document.getElementById("fact-close");
    const factScrim = document.getElementById("fact-scrim");

    function openFactSheet(key) {
      const f = FACTS[key];
      if (!f || !factSheet) return;
      factTitle.textContent = f.title;
      factBody.textContent = factText(key, f.body);
      factSheet.hidden = false;
    }

    function closeFactSheet() {
      if (factSheet) factSheet.hidden = true;
    }

    document.querySelectorAll(".m-cell-fact").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        openFactSheet(btn.dataset.fact);
      });
    });

    function onFactDismiss(e) {
      e.preventDefault();
      e.stopPropagation();
      closeFactSheet();
    }

    factClose?.addEventListener("click", onFactDismiss);
    factScrim?.addEventListener("click", onFactDismiss);

    let previewMode = false;
    let metricsRaf = 0;

    function fmtTime(date) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "—";
      let h = date.getHours();
      const m = date.getMinutes();
      const ap = h >= 12 ? "p" : "a";
      h = h % 12;
      if (h === 0) h = 12;
      return `${h}:${String(m).padStart(2, "0")}${ap}`;
    }

    function fmtDateTime(date) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "—";
      const mon = date.toLocaleString(undefined, { month: "short" });
      const day = date.getDate();
      return `${mon} ${day} · ${fmtTime(date)}`;
    }


    function saveLoc(lat, lon, source) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ lat, lon, source }));
      } catch (_) {}
    }

    function loadSavedLoc() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (!Number.isFinite(o.lat) || !Number.isFinite(o.lon)) return null;
        return o;
      } catch (_) {
        return null;
      }
    }

    let surfaceAnchor = {
      t: Date.parse("2026-10-08T12:00:00Z"),
      l0: 255,
      rotationDays: ROTATION_DAYS,
    };

    function l0Degrees(date) {
      const days = (date.getTime() - surfaceAnchor.t) / 86400000;
      const rate = 360 / (surfaceAnchor.rotationDays || ROTATION_DAYS);
      return (((surfaceAnchor.l0 - rate * days) % 360) + 360) % 360;
    }

    /** phase 0…1 in the baked AIA window (from frames.json via globe). */
    function livePhase01(date = new Date()) {
      // Use __sunGlobe — `globe` is in TDZ while createSunGlobe is still running.
      const g = window.__sunGlobe;
      if (g?.moviePhase01FromDate) return g.moviePhase01FromDate(date);
      return 0;
    }

    /** Inverse: scrub phase → wall time inside the bake window. */
    function dateFromCyclePhase(targetPhase) {
      const g = window.__sunGlobe;
      if (g?.dateFromMoviePhase01) return g.dateFromMoviePhase01(targetPhase);
      return new Date();
    }

    function angArcminFromDistKm(distKm) {
      if (!(distKm > 0)) return NaN;
      return ((2 * Math.atan(SUN_RADIUS_KM / distKm) * 180) / Math.PI) * 60;
    }

    function computeMetrics(info) {
      const A = globalThis.Astronomy;
      if (!A || !info) return null;
      const when = info.when instanceof Date ? info.when : new Date(info.when);
      const lat = Number(info.lat);
      const lon = Number(info.lon);
      const phase01 = Number(info.phase01);
      let distKm = NaN;
      let ang = NaN;
      try {
        const time = A.MakeTime(when);
        const vec = A.GeoVector(A.Body.Sun, time, true);
        distKm = Math.hypot(vec.x, vec.y, vec.z) * A.KM_PER_AU;
        ang = angArcminFromDistKm(distKm);
      } catch (_) {}

      let rise = null;
      let high = null;
      let set = null;
      try {
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
          const obs = new A.Observer(lat, lon, 0);
          const setEv = A.SearchRiseSet(A.Body.Sun, obs, -1, when, 2);
          if (setEv) {
            set = setEv;
            const riseStart = new Date(setEv.date.getTime() - 28 * 3600000);
            const riseEv = A.SearchRiseSet(A.Body.Sun, obs, +1, riseStart, 1.2);
            if (riseEv && riseEv.date < setEv.date) {
              rise = riseEv;
              const tr = A.SearchHourAngle(A.Body.Sun, obs, 0, riseEv.date, +1);
              if (tr && tr.time && tr.time.date <= setEv.date) high = tr;
            }
          }
        }
      } catch (_) {}

      const riseDate = rise ? rise.date : null;
      const setDate = set ? set.date : null;
      let dayLenHr = NaN;
      if (riseDate && setDate) {
        const hrs = (setDate.getTime() - riseDate.getTime()) / 3600000;
        if (Number.isFinite(hrs) && hrs > 0 && hrs <= 48) dayLenHr = hrs;
      }

      return {
        phase01,
        cycleDay: (Number.isFinite(phase01) ? phase01 : livePhase01(when)) * ROTATION_DAYS,
        distAu: distKm / A.KM_PER_AU,
        ang,
        dayLenHr,
        rise: riseDate,
        high: high && high.time ? high.time.date : null,
        set: setDate,
        when,
      };
    }

    let lastDistAu = NaN;
    let windKms = NaN;
    const KM_PER_AU = 149597870.7;

    function factText(key, fallback) {
      if (key === "dist" && Number.isFinite(lastDistAu)) {
        const km = lastDistAu * KM_PER_AU;
        const mi = km * MI_PER_KM;
        return `${(mi / 1e6).toFixed(1)} million miles, ${(km / 1e6).toFixed(1)} million km. That is ${lastDistAu.toFixed(3)} Astronomical Units. One Astronomical Unit is the average. Closest in early January, farthest in early July.`;
      }
      if (key === "wind" && Number.isFinite(windKms)) {
        const mis = windKms / 1.609344;
        return `Protons and electrons from the corona. Now ${Math.round(mis)} mi/s (${Math.round(windKms)} km/s). Typical is about 250 mi/s (400 km/s). DSCOVR or ACE measures it at L1, a million miles sunward of Earth, 15–60 minutes before it interacts with Earth's magnetosphere.`;
      }
      return fallback;
    }

    let weather = { xray: "—", scales: "—", kp: "—", wind: "—", protons: "—" };
    let weatherAt = 0;

    function paintWeather() {
      el.xray.textContent = weather.xray;
      el.scales.textContent = weather.scales;
      el.kp.textContent = weather.kp;
      el.wind.textContent = weather.wind;
      el.protons.textContent = weather.protons;
    }

    function lastRow(data) {
      return Array.isArray(data) && data.length ? data[data.length - 1] : null;
    }

    function scaleDigit(block) {
      if (!block || block.Scale == null || block.Scale === "") return "0";
      const n = Number(block.Scale);
      return Number.isFinite(n) ? String(Math.max(0, Math.min(5, Math.round(n)))) : "0";
    }

    function formatProtonPfu(flux) {
      const n = Number(flux);
      if (!Number.isFinite(n) || n < 0) return "—";
      if (n >= 1000) return n.toExponential(1).replace("e+", "e");
      if (n >= 10) return String(Math.round(n));
      if (n >= 1) return n.toFixed(1);
      if (n >= 0.1) return n.toFixed(2);
      return n.toFixed(3);
    }

    function latestProton10(rows) {
      if (!Array.isArray(rows)) return null;
      for (let i = rows.length - 1; i >= 0; i--) {
        const r = rows[i];
        if (r && r.energy === ">=10 MeV" && Number.isFinite(Number(r.flux))) return r;
      }
      return null;
    }

    async function updateSpaceWeather(force) {
      if (!force && Date.now() - weatherAt < 60000) {
        paintWeather();
        return;
      }
      weatherAt = Date.now();
      try {
        const [flare, scales, kp, wind, protons] = await Promise.all([
          fetch("https://services.swpc.noaa.gov/json/goes/primary/xray-flares-latest.json").then((r) => r.json()),
          fetch("https://services.swpc.noaa.gov/products/noaa-scales.json").then((r) => r.json()),
          fetch("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json").then((r) => r.json()),
          fetch("https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json").then((r) => r.json()),
          fetch("https://services.swpc.noaa.gov/json/goes/primary/integral-protons-6-hour.json").then((r) => r.json()),
        ]);
        const f = lastRow(flare) || flare;
        const nowScale = scales && typeof scales === "object" ? scales["0"] : null;
        const k = lastRow(kp);
        const w = lastRow(wind);
        const p = latestProton10(protons);
        if (f && f.current_class) weather.xray = String(f.current_class);
        if (nowScale) {
          weather.scales = `R${scaleDigit(nowScale.R)} S${scaleDigit(nowScale.S)} G${scaleDigit(nowScale.G)}`;
        }
        if (k && Number.isFinite(Number(k.estimated_kp))) weather.kp = Number(k.estimated_kp).toFixed(2);
        if (w && Number.isFinite(Number(w.proton_speed))) {
          windKms = Number(w.proton_speed);
          weather.wind = `${Math.round(windKms / 1.609344)} mi/s`;
        }
        if (p) weather.protons = formatProtonPfu(p.flux);
      } catch (_) {}
      paintWeather();
    }


    function paintMetrics(info) {
      const m = computeMetrics(info);
      if (!m) return;
      el.cycle.textContent = `${m.cycleDay.toFixed(1)}/${ROTATION_DAYS.toFixed(1)}`;
      lastDistAu = m.distAu;
      el.dist.textContent = Number.isFinite(m.distAu) ? `${m.distAu.toFixed(3)} AU` : "—";
      el.size.textContent = Number.isFinite(m.ang) ? `${m.ang.toFixed(1)}′` : "—";
      el.rise.textContent = fmtTime(m.rise);
      el.high.textContent = fmtTime(m.high);
      el.set.textContent = fmtTime(m.set);
      el.daylen.textContent = Number.isFinite(m.dayLenHr) ? `${m.dayLenHr.toFixed(1)} hr` : "—";
      if (cycleDate) cycleDate.textContent = fmtDateTime(m.when);
      updateSpaceWeather(false);
    }

    function showPhase(info) {
      if (!info) return;
      if (metricsRaf) cancelAnimationFrame(metricsRaf);
      metricsRaf = requestAnimationFrame(() => {
        metricsRaf = 0;
        paintMetrics(info);
      });
    }

    function applyDefaultLocation() {
      applyLocation(DEFAULT_LOC.lat, DEFAULT_LOC.lon, "default");
    }

    function setLiveUI() {
      if (!liveBtn) return;
      liveBtn.classList.toggle("is-preview", previewMode);
      liveBtn.classList.toggle("is-live", !previewMode);
      liveBtn.textContent = "Live";
    }

    function goLive(opts = {}) {
      previewMode = false;
      if (globe.isOrbiting()) {
        globe.setOrbiting(false);
        setOrbitUI(false);
      }
      const now = new Date();
      let info = null;
      const paint = opts.paint !== false;
      try {
        // "Now" → bake window only (same clock as 60s tick).
        info = globe.setTime(now, { lockOrient: false, paint });
        globe.resetView();
      } catch (err) {
        console.warn("goLive setTime/resetView", err);
      }
      showPhase(info || globe.getPhaseInfo());
      setLiveUI();
    }

    let redModeOn = false;
    const visionBtn = document.getElementById("vision-btn");
    const orbitBtn = document.getElementById("orbit-btn");

    function setRedMode(on) {
      redModeOn = !!on;
      document.body.classList.toggle("is-red-mode", redModeOn);
      // Label = what you get when you press (next action)
      visionBtn.textContent = redModeOn ? "White" : "Red";
      visionBtn.setAttribute("aria-pressed", redModeOn ? "true" : "false");
      visionBtn.title = redModeOn
        ? "Return to normal (white) display"
        : "Night vision: red display for dark-adapted eyes";
    }

    function toggleRedMode() {
      setRedMode(!redModeOn);
    }

    visionBtn.addEventListener("click", (e) => {
      e.preventDefault();
      toggleRedMode();
    });

    function setOrbitUI(on) {
      const active = !!on;
      orbitBtn.setAttribute("aria-pressed", active ? "true" : "false");
      orbitBtn.title = active
        ? "Stop orbit"
        : "Orbit: camera + Carrington face (tap again to stop)";
    }

    let orbitBootPending = true;
    function tryStartOrbitBoot() {
      if (!orbitBootPending) return;
      // One opening face: plate 0 (not poster, not Live-at-end).
      if (globe.isFramePainted && !globe.isFramePainted(0)) return;
      orbitBootPending = false;
      globe.setOrbiting(true, { fromFrame: 0 });
      setOrbitUI(true);
    }

    orbitBtn.addEventListener("click", (e) => {
      e.preventDefault();
      const next = !globe.isOrbiting();
      globe.setOrbiting(next);
      setOrbitUI(next);
    });

    // Block copy / select (showcase PWA); inputs still selectable via CSS
    for (const evt of ["copy", "cut", "selectstart"]) {
      document.addEventListener(
        evt,
        (e) => {
          const t = e.target;
          if (t && (t.closest?.("input,textarea") || t.isContentEditable)) return;
          e.preventDefault();
        },
        { capture: true }
      );
    }

    const globe = createSunGlobe(canvas, {
      onReady() {
        canvas.classList.add("is-ready");
        status.textContent = "";
        status.style.display = "none";
        updateSpaceWeather(true);
      },
      onQuality(kind) {
        // Boot Orbit after plate 0 is on the plate (single opening face).
        if (kind === "frames") tryStartOrbitBoot();
      },
      onPhase: showPhase,
      onOrbitChange(on) {
        setOrbitUI(on);
        if (on) {
          previewMode = true;
          setLiveUI();
          showPhase(globe.getPhaseInfo());
        }
      },
      onScrub() {
        previewMode = true;
        setLiveUI();
      },
    });
    window.__sunGlobe = globe;

    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (factSheet && !factSheet.hidden) {
        closeFactSheet();
        return;
      }
      if (redModeOn) setRedMode(false);
      if (globe.isOrbiting()) {
        globe.setOrbiting(false);
        setOrbitUI(false);
      }
    });

    // Flame tuner stays hidden (movie mode). Opt in with ?flame.
    (function wireFlameTune() {
      const panel = document.getElementById("flame-tune");
      if (!panel || !globe?.setFlameParams) return;
      if (!new URLSearchParams(location.search).has("flame")) {
        panel.hidden = true;
        return;
      }
      panel.hidden = false;
      const title = document.getElementById("ft-title");
      const nameEl = document.getElementById("ft-pattern-name");
      const inputs = [...panel.querySelectorAll("input[data-flame]")];
      const defaults = { pattern: 0, intensity: globe.getFlameParams().intensity };

      function paint() {
        const p = globe.getFlameParams();
        title.textContent = `Flame F${p.try}`;
        if (nameEl) nameEl.textContent = `P${p.pattern} · ${p.name}`;
        for (const input of inputs) {
          const key = input.dataset.flame;
          if (!Number.isFinite(p[key])) continue;
          input.value = String(p[key]);
          const num = input.parentElement?.querySelector(".n");
          if (num) {
            num.textContent =
              key === "pattern" ? String(p.pattern) : Number(p[key]).toFixed(2);
          }
        }
      }

      function read() {
        const next = {};
        for (const input of inputs) next[input.dataset.flame] = Number(input.value);
        globe.setFlameParams(next);
        paint();
      }

      for (const input of inputs) {
        input.addEventListener("input", read);
        input.addEventListener("change", read);
      }
      panel.addEventListener("pointerdown", (e) => e.stopPropagation());
      panel.addEventListener("touchstart", (e) => e.stopPropagation(), { passive: true });
      document.getElementById("ft-hide")?.addEventListener("click", () => {
        panel.hidden = true;
        localStorage.setItem("supersun-flame-tune", "0");
      });
      document.getElementById("ft-reset")?.addEventListener("click", () => {
        globe.setFlameParams(defaults);
        paint();
      });
      document.getElementById("ft-copy")?.addEventListener("click", async () => {
        const p = globe.getFlameParams();
        const text = JSON.stringify(p, null, 2);
        try {
          await navigator.clipboard.writeText(text);
        } catch (_) {
          console.log(text);
        }
      });
      paint();
    })();

    fetch("surface.json")
      .then((r) => r.json())
      .then((j) => {
        if (!j || !Number.isFinite(Number(j.l0)) || !j.anchor) return;
        const t0 = Date.parse(j.anchor);
        if (!Number.isFinite(t0)) return;
        surfaceAnchor = {
          t: t0,
          l0: Number(j.l0),
          rotationDays: Number(j.rotationDays) || ROTATION_DAYS,
        };
        if (!previewMode && globe) showPhase(globe.getPhaseInfo());
      })
      .catch(() => {});

    function applyLocation(lat, lon, source, opts = {}) {
      globe.setObserver(lat, lon);
      const paint = opts.paint !== false;
      if (!previewMode) {
        globe.setTime(new Date(), { lockOrient: false, paint });
      } else {
        const phase = globe.getPhaseInfo()?.phase01 ?? livePhase01();
        if (globe.setCyclePhase) globe.setCyclePhase(phase, { paint });
        else {
          globe.setTime(dateFromCyclePhase(phase), {
            lockOrient: true,
            orientDate: new Date(),
            paint,
          });
        }
      }
      showPhase(globe.getPhaseInfo());
      saveLoc(lat, lon, source);
    }

    function onLiveActivate(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      goLive();
    }

    // click + pointerup: iOS sometimes eats click after touch-action wars
    liveBtn.addEventListener("click", onLiveActivate);
    liveBtn.addEventListener(
      "pointerup",
      (e) => {
        if (e.pointerType === "mouse" && e.button !== 0) return;
        onLiveActivate(e);
      },
      { passive: false }
    );

    // Boot: metrics → Live, face → plate 0 only (one opening, then Orbit).
    const saved = loadSavedLoc();
    if (saved) {
      applyLocation(saved.lat, saved.lon, saved.source || "saved", {
        paint: false,
      });
    } else {
      applyLocation(DEFAULT_LOC.lat, DEFAULT_LOC.lon, "default", {
        paint: false,
      });
    }
    goLive({ paint: false });
    requestAnimationFrame(() => tryStartOrbitBoot());

    setInterval(() => {
      if (previewMode) return;
      // Same bake-window clock as Live (paints unless Orbit owns the face).
      const info = globe.setTime(new Date(), { lockOrient: false });
      showPhase(info || globe.getPhaseInfo());
    }, 60000);

    function pwaFillHeightPx() {
      const iw = window.innerWidth || 0;
      const ih = window.innerHeight || 0;
      const sw = window.screen.width || 0;
      const sh = window.screen.height || 0;
      // iOS keeps screen.* in portrait metrics; pick the axis for current height.
      if (ih >= iw) return Math.max(ih, Math.max(sw, sh));
      return Math.max(ih, Math.min(sw, sh));
    }

    /** iPad PWA: screen.* undershoots CSS inner — phone uses screen height instead. */
    function pwaExtraBottomPx() {
      const iw = window.innerWidth || 0;
      const ih = window.innerHeight || 0;
      const sw = window.screen.width || 0;
      const sh = window.screen.height || 0;
      const screenMax = Math.max(sw, sh);
      if (Math.min(iw, ih) < 600) return 0;
      if (screenMax >= ih - 10) return 0;
      return Math.max(readSafeInsetBottom(), 20);
    }

    function syncPwaFillHeight() {
      const root = document.documentElement;
      if (!root.classList.contains("pwa-standalone")) {
        root.style.removeProperty("--pwa-fill-h");
        root.style.removeProperty("--pwa-extra-b");
        return 0;
      }
      const fillH = pwaFillHeightPx();
      const extra = pwaExtraBottomPx();
      root.style.setProperty("--pwa-fill-h", `${fillH}px`);
      root.style.setProperty("--pwa-extra-b", `${extra}px`);
      return fillH + extra;
    }

    function readSafeInsetBottom() {
      const probe = document.createElement("div");
      probe.style.cssText =
        "position:fixed;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)";
      document.body.appendChild(probe);
      const px = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
      probe.remove();
      return px;
    }

    function onResize() {
      syncPwaFillHeight();
      globe.fitToHost();
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", () => {
      setTimeout(onResize, 50);
      setTimeout(onResize, 300);
    });
    window.visualViewport?.addEventListener("resize", onResize);
    window.addEventListener("pageshow", onResize);
    syncPwaFillHeight();
    onResize();
    setTimeout(onResize, 100);
    setTimeout(onResize, 400);
  </script>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
