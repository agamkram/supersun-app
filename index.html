  <script>
    /* iOS A2HS: lock fill height before first paint.
       Phone: screen.height > inner → use screen.
       iPad: screen.* often *undershoots* inner → add safe-area extra. */
    (function () {
      var n = window.navigator;
      var standalone =
        n.standalone === true ||
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: fullscreen)").matches;
      if (!standalone) return;
      var root = document.documentElement;
      root.classList.add("pwa-standalone");
      var iw = window.innerWidth || 0;
      var ih = window.innerHeight || 0;
      var sw = window.screen.width || 0;
      var sh = window.screen.height || 0;
      var screenMax = Math.max(sw, sh);
      var screenMin = Math.min(sw, sh);
      var fillH = ih >= iw ? Math.max(ih, screenMax) : Math.max(ih, screenMin);
      var extra = 0;
      if (Math.min(iw, ih) >= 600 && screenMax < ih - 10) {
        extra = 20; /* refined to real insetB once body exists */
      }
      root.style.setProperty("--pwa-fill-h", fillH + "px");
      root.style.setProperty("--pwa-extra-b", extra + "px");
    })();
  </script>

  <style>
    :root {
      color-scheme: dark;
      --text: #e8f4fc;
      --muted: #7eb8d8;
      --dim: #6aa8cc;
      --faint: #4a88a8;
      --cell: transparent;
      --panel: rgba(18, 22, 30, 0.58);
      --line: rgba(42, 49, 64, 0.65);
      --moon: #c8d0e0;
      --mono: "Inter", system-ui, sans-serif;
      --font: "Inter", system-ui, sans-serif;
      /* Compact instrument labels */
      --label-size: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-height: 100%;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background: #020308;
      color: var(--text);
      font-family: var(--font);
      -webkit-text-size-adjust: 100%;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input,
    textarea {
      -webkit-user-select: text;
      user-select: text;
    }

    /*
     * Full-bleed GL stack. Do NOT use max-height:100dvh — undershoots on iOS.
     * Safari: env() overpaint. Home-screen PWA: height locked to screen (see JS)
     * because innerHeight stays short of screen.height and clips env() overshoot.
     */
    #stage,
    #moon-host,
    #touch-plane {
      position: fixed;
      top: calc(-1 * env(safe-area-inset-top, 0px));
      right: calc(-1 * env(safe-area-inset-right, 0px));
      bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
      left: calc(-1 * env(safe-area-inset-left, 0px));
    }

    html.pwa-standalone,
    html.pwa-standalone body {
      height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
      min-height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
    }

    html.pwa-standalone #stage,
    html.pwa-standalone #moon-host,
    html.pwa-standalone #touch-plane {
      top: 0;
      right: 0;
      bottom: auto;
      left: 0;
      width: 100%;
      height: calc(var(--pwa-fill-h, 100%) + var(--pwa-extra-b, 0px));
    }

    /* Clips the oversized GL canvas; black matches clear color */
    #moon-host {
      z-index: 1;
      overflow: hidden;
      background: #020308;
    }

    /* Gesture layer above canvas, under real UI controls */
    #touch-plane {
      z-index: 2;
      touch-action: none;
      background: transparent;
    }

    #moon-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.2s ease;
      background: #020308;
    }

    #moon-canvas.is-ready { opacity: 1; }
    /* PWA: no fade — opacity pop reads as a flash on open */
    html.pwa-standalone #moon-canvas {
      transition: none;
    }
    #moon-canvas:active { cursor: grabbing; }

    .chrome {
      position: fixed;
      z-index: 4;
      left: 0;
      right: 0;
      top: 0;
      height: calc(0.375in + env(safe-area-inset-top, 0px));
      padding:
        env(safe-area-inset-top, 0px)
        max(1rem, env(safe-area-inset-right))
        0
        max(1rem, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      text-align: center;
    }

    /* Same title treatment as Solar Dashboard (Michroma), CamelCase */
    .app-title {
      margin: 0;
      font-family: "Michroma", var(--font), system-ui, sans-serif;
      font-weight: 400;
      font-size: clamp(1.05rem, 3.2vmin, 1.35rem); /* match LightSlice title */
      letter-spacing: 0.1em;
      line-height: 1.15;
      color: var(--text);
      text-align: center;
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.55);
    }

    /*
     * Bottom metrics: one quiet panel, compact instrument rows.
     * pointer-events:none on shell — only controls capture so 2fs works over empty areas.
     * Moon zooms over this; un-zoom / Live to use the controls.
     */
    .loc-bar {
      position: fixed;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding:
        0.1rem
        max(0.3rem, env(safe-area-inset-right))
        max(0.3rem, env(safe-area-inset-bottom, 0px))
        max(0.3rem, env(safe-area-inset-left));
      background: transparent;
      pointer-events: none;
      touch-action: none;
      display: flex;
      flex-direction: column;
      gap: 0.12rem;
    }

    .loc-bar input,
    .loc-bar button,
    .loc-bar input[type="range"],
    .loc-bar .cycle,
    .loc-bar .cycle-controls,
    .loc-bar .slider-track {
      pointer-events: auto;
      touch-action: manipulation;
    }

    /* Horizontal scrub must win over page/globe pan on iPad Safari */
    .loc-bar #phase-slider {
      touch-action: pan-x;
    }

    :root {
      --m-row-h: 1.7rem;
      --m-cell-pad: 2px 0.4rem;
      --m-cell-gap: 1px;
    }

    .metrics-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0.18rem 0.14rem;
      display: flex;
      flex-direction: column;
      gap: 0.06rem;
      pointer-events: none;
    }

    .m-grid {
      display: grid;
      /* Modest Phase bias — keep Illum / Cycle / To full readable */
      grid-template-columns: 1.35fr 0.9fr 1fr 0.85fr;
      grid-auto-rows: var(--m-row-h);
      gap: 0;
      pointer-events: none;
    }

    /* Station bias — tide times stay compact (clock strings) */
    .m-grid-3 {
      grid-template-columns:
        minmax(0, 1.7fr)
        minmax(3.6rem, 0.38fr)
        minmax(3.6rem, 0.38fr)
        minmax(3.6rem, 0.38fr);
      grid-auto-rows: var(--m-row-h);
      gap: 0;
    }

    /* Rise / high / set + tool strip (actions ≠ stats) */
    .m-grid-rise {
      grid-template-columns:
        minmax(0, 0.82fr) minmax(0, 0.82fr) minmax(0, 0.82fr)
        minmax(9.6rem, 1.4fr);
      grid-auto-rows: var(--m-row-h);
      align-items: stretch;
      gap: 0;
    }

    .tool-strip {
      display: flex;
      align-items: stretch;
      gap: 1px;
      min-width: 9.6rem;
      width: 100%;
      padding: 1px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.05);
      border: none;
      pointer-events: auto;
    }

    #m-station {
      font-size: 11px;
      line-height: 1.1;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .vision-btn {
      flex: 1 1 auto;
      min-width: 2.7rem;
      height: 100%;
      min-height: 0;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--dim);
      font-family: var(--font);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      touch-action: manipulation;
      line-height: 1;
      padding: 0 0.45rem;
      -webkit-tap-highlight-color: transparent;
    }

    #sites-btn {
      min-width: 3.8rem;
    }

    /* On only — no hover “third” look */
    .vision-btn[aria-pressed="true"] {
      background: rgba(232, 244, 252, 0.18);
      color: var(--text);
    }

    #sites-btn[data-mode="famous"] {
      color: #f0d78c;
      background: rgba(240, 215, 140, 0.18);
    }

    #sites-btn[data-mode="landings"] {
      color: #8bcdf0;
      background: rgba(104, 188, 232, 0.18);
    }

    #sites-btn[data-mode="all"] {
      color: #8fd4a8;
      background: rgba(107, 191, 138, 0.2);
    }

    body.is-red-mode .vision-btn {
      background: transparent;
      color: var(--dim);
    }

    body.is-red-mode .vision-btn[aria-pressed="true"] {
      background: rgba(200, 28, 36, 0.55);
      color: var(--text);
    }

    .m-cell {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: var(--m-cell-pad);
      min-width: 0;
      min-height: var(--m-row-h);
      height: var(--m-row-h);
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: stretch;
      gap: var(--m-cell-gap);
      overflow: hidden;
    }

    .m-grid > .m-cell + .m-cell,
    .m-grid-3 > .m-cell + .m-cell,
    .m-grid-rise > .m-cell + .m-cell {
      box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.05);
    }

    button.m-cell-fact {
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
      width: 100%;
    }

    button.m-cell-fact:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .m-cell .k {
      font-size: var(--label-size);
      font-weight: 500;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.1;
      flex: 0 0 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: 0.9;
    }

    .m-cell .v {
      font-family: var(--font);
      font-weight: 600;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.15;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 0 0 auto;
      min-width: 0;
    }

    .m-cell .v.sm { font-size: 11px; }
    .m-cell .v.moon {
      color: var(--moon);
      font-size: 11px;
      letter-spacing: -0.015em;
    }

    /*
     * Tablets (iPad and similar): phone landscape is excluded via min-height.
     * Coarse pointer + both sides ≥600px ≈ tablet class across platforms.
     */
    @media (pointer: coarse) and (min-width: 600px) and (min-height: 600px) {
      :root {
        --m-row-h: 2rem;
        --m-cell-pad: 3px 0.45rem;
        --m-cell-gap: 1px;
        --label-size: 9px;
      }

      .loc-bar {
        max-width: 620px;
        gap: 0.16rem;
        padding-left: max(0.55rem, env(safe-area-inset-left));
        padding-right: max(0.55rem, env(safe-area-inset-right));
      }

      .metrics-panel {
        border-radius: 12px;
        padding: 0.22rem 0.18rem;
        gap: 0.08rem;
      }

      .m-grid {
        grid-template-columns: 1.35fr 0.9fr 1fr 0.85fr;
      }

      .m-grid-3 {
        grid-template-columns:
          minmax(0, 1.7fr)
          minmax(4.1rem, 0.38fr)
          minmax(4.1rem, 0.38fr)
          minmax(4.1rem, 0.38fr);
      }

      .m-cell .k {
        letter-spacing: 0.03em;
      }

      .m-cell .v,
      .m-cell .v.sm,
      .m-cell .v.moon {
        font-size: 13px;
      }

      #m-station {
        font-size: 12px;
      }

      .m-grid-rise {
        grid-template-columns:
          minmax(0, 0.82fr) minmax(0, 0.82fr) minmax(0, 0.82fr)
          minmax(11rem, 1.4fr);
      }

      .vision-btn {
        font-size: 10px;
        min-width: 2.8rem;
        padding: 0 0.45rem;
      }

      #sites-btn {
        min-width: 4.2rem;
      }

      .loc-strip {
        gap: 0;
      }

      .loc-card {
        max-height: 2.35rem;
        border-radius: 0;
      }

      .loc-place-row {
        min-height: 1.2rem;
        height: 1.2rem;
        gap: 0.3rem;
      }

      .loc-coords {
        font-size: 13px;
      }

      .loc-place-row button,
      .geo-btn,
      .hemi button {
        font-size: 10px;
        min-height: 1.2rem;
      }

      .hemi {
        min-height: 1.2rem;
        height: 1.2rem;
      }

      .cycle-date {
        font-size: 13px;
      }

      .live-btn {
        font-size: 11px;
        min-height: 1.4rem;
        padding: 0 0.55rem;
      }

      .slider-track {
        height: 56px;
        margin: -6px 0;
        padding: 6px 0;
        box-sizing: content-box;
      }

      #phase-slider {
        height: 56px;
      }

      #phase-slider::-webkit-slider-runnable-track {
        height: 10px;
      }

      #phase-slider::-webkit-slider-thumb {
        width: 44px;
        height: 44px;
        margin-top: -17px;
      }

      #phase-slider::-moz-range-track {
        height: 10px;
      }

      #phase-slider::-moz-range-thumb {
        width: 44px;
        height: 44px;
      }
    }

    /*
     * Phone landscape only (short height). iPad landscape is taller (≥600px)
     * and keeps the normal / tablet layouts. Shrink stats so the moon stays visible.
     */
    @media (orientation: landscape) and (max-height: 500px) {
      .chrome {
        height: calc(0.28in + env(safe-area-inset-top, 0px));
      }

      .app-title {
        font-size: 0.16in;
      }

      .loc-bar {
        max-width: min(620px, 96vw);
        gap: 0.06rem;
        padding-top: 0.06rem;
        /* zoom reduces used layout height on iOS (transform would not) */
        zoom: 0.72;
      }

      :root {
        --m-row-h: 1.35rem;
        --m-cell-pad: 1px 0.28rem;
        --m-cell-gap: 0;
        --label-size: 6.5px;
      }

      .metrics-panel {
        gap: 0.06rem;
      }

      .m-cell .v,
      .m-cell .v.sm,
      .m-cell .v.moon {
        font-size: 9px;
      }

      .vision-btn {
        font-size: 7px;
        min-width: 2rem;
        padding: 0 0.25rem;
      }

      #sites-btn {
        min-width: 2.8rem;
      }

      .loc-strip {
        gap: 0;
      }

      .cycle {
        padding: 0.06rem 0.22rem 0.02rem;
        gap: 0.06rem;
      }
    }

    /* Phone portrait: trim space under slider / Live row */
    @media (pointer: coarse) and (max-width: 599px) {
      .cycle {
        padding-bottom: 1px;
      }
    }

    /* Compact location + hemi row (desktop was ballooning under the cycle slider) */
    .loc-strip {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      flex: 0 0 auto;
      align-items: stretch;
      min-height: 0;
      margin-top: 0.06rem;
      padding-top: 0.06rem;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    }

    .loc-card {
      display: flex;
      background: transparent;
      border: none;
      border-radius: 0;
      min-width: 0;
      min-height: 0;
      height: auto;
      max-height: 2.05rem;
      box-sizing: border-box;
    }

    .loc-card-place,
    .loc-card.hemi-card {
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      gap: 0.12rem;
      padding: 0.12rem 0.35rem;
    }

    .loc-card.hemi-card {
      box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.05);
    }

    .loc-label,
    .hemi-label {
      font-size: var(--label-size);
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--dim);
      line-height: 1.15;
      text-align: left;
      margin: 0;
      flex: 0 0 auto;
    }

    .hemi-label {
      text-align: center;
    }

    .loc-place-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      min-width: 0;
      width: 100%;
      flex: 0 0 auto;
      min-height: 1.15rem;
      height: 1.15rem;
    }

    .loc-coords {
      font-family: var(--font);
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      line-height: 1.1;
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }

    .geo-btn {
      flex: 0 0 auto;
      width: 1.4rem;
      height: 1.15rem;
      min-width: 1.4rem;
      padding: 0 !important;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      line-height: 0;
    }

    .geo-btn svg {
      width: 12px;
      height: 12px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hemi {
      display: flex;
      gap: 2px;
      flex: 0 0 auto;
      width: 100%;
      min-height: 1.15rem;
      height: 1.15rem;
      align-items: stretch;
    }

    .hemi button {
      flex: 1 1 0;
      min-width: 0;
      min-height: 0;
      height: 100%;
      padding: 0 0.15rem;
      font-size: 8px;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }

    .loc-card button {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-family: var(--font);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 0.08rem 0.26rem;
      cursor: pointer;
      line-height: 1.05;
      white-space: nowrap;
    }

    .hemi button {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-family: var(--font);
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      line-height: 1.05;
      white-space: nowrap;
    }

    .hemi button.active {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.28);
    }

    /* Hidden lat/lon still updated for hemi flip / storage */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Map location picker (Edit) */
    .loc-dialog {
      position: fixed;
      inset: 0;
      z-index: 300;
      margin: 0;
      padding: 0;
      max-width: none;

    const factSheet = document.getElementById("fact-sheet");
    const factTitle = document.getElementById("fact-title");
    const factBody = document.getElementById("fact-body");
    const factClose = document.getElementById("fact-close");
    const factScrim = document.getElementById("fact-scrim");

    function openFactSheet(key) {
      const f = FACTS[key];
      if (!f || !factSheet) return;
      factTitle.textContent = f.title;
      const shown = (el[key]?.textContent || "").trim();
      factBody.textContent =
        shown && shown !== "—"
          ? `Right now this box shows “${shown}”.\n\n${f.body}`
          : f.body;
      factSheet.hidden = false;
    }

    function closeFactSheet() {
      if (factSheet) factSheet.hidden = true;
    }

    document.querySelectorAll(".m-cell-fact").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        openFactSheet(btn.dataset.fact);
      });
    });

    function onFactDismiss(e) {
      e.preventDefault();
      e.stopPropagation();
      closeFactSheet();
    }

    factClose?.addEventListener("click", onFactDismiss);
    factScrim?.addEventListener("click", onFactDismiss);

    let previewMode = false;
    let previewRaf = 0;
    let metricsRaf = 0;
    let tideSeq = 0;
    let tideTimer = 0;
    /** Last successfully resolved station label (avoid flash to —) */
    let lastTideStationLabel = "";
    /** @type {Promise<Array<{id:string,lat:number,lng:number,name?:string,state?:string}>> | null} */
    let stationsPromise = null;
    /** @type {{ yr: number, maxAng: number } | null} */
    let yearMaxCache = null;

    function fmtCoord(n, pos, neg) {
      const a = Math.abs(n);
      const hemi = n >= 0 ? pos : neg;
      return `${a.toFixed(2)}°${hemi}`;
    }

    function fmtTime(date) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "—";
      let h = date.getHours();
      const m = date.getMinutes();
      const ap = h >= 12 ? "p" : "a";
      h = h % 12;
      if (h === 0) h = 12;
      return `${h}:${String(m).padStart(2, "0")}${ap}`;
    }

    function fmtDateTime(date) {
      if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "—";
      const mon = date.toLocaleString(undefined, { month: "short" });
      const day = date.getDate();
      return `${mon} ${day} · ${fmtTime(date)}`;
    }

    function ymdCompact(d) {
      const y = d.getUTCFullYear();
      const m = String(d.getUTCMonth() + 1).padStart(2, "0");
      const day = String(d.getUTCDate()).padStart(2, "0");
      return `${y}${m}${day}`;
    }

    function haversineKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const p1 = (lat1 * Math.PI) / 180;
      const p2 = (lat2 * Math.PI) / 180;
      const dp = ((lat2 - lat1) * Math.PI) / 180;
      const dl = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dp / 2) ** 2 +
        Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
    }

    function normalizeStationList(rawList, { requireTypeR = false } = {}) {
      return (rawList || [])
        .filter(
          (s) =>
            s &&
            s.id &&
            Number.isFinite(Number(s.lat)) &&
            Number.isFinite(Number(s.lng)) &&
            (!requireTypeR || s.type === "R" || s.type == null)
        )
        .map((s) => ({
          id: String(s.id),
          lat: Number(s.lat),
          lng: Number(s.lng),
          name: String(s.name || s.id)
            .trim()
            .replace(/\s+/g, " ")
            .replace(/\s*,\s*/g, ", "),
          state: s.state ? String(s.state).trim() : "",
        }))
        .filter((s) => !INLAND_STATION_RE.test(s.name));
    }

    async function fetchStationsFromNetwork() {
      // 1) Vercel proxy (pre-filtered coastal R stations)
      try {
        const res = await fetch(NOAA_STATIONS_PROXY);
        if (res.ok) {
          const data = await res.json();
          const list = normalizeStationList(data.stations || data.list || []);
          if (list.length >= 10) return list;
        }
      } catch (_) {}

      // 2) Direct NOAA metadata (works with CORS *)
      const res = await fetch(NOAA_STATIONS_DIRECT);
      if (!res.ok) throw new Error("stations fetch failed");
      const data = await res.json();
      const list = normalizeStationList(data.stations || [], {
        requireTypeR: true,
      });
      if (list.length < 10) throw new Error("stations list empty");
      return list;
    }

    function loadTideStations() {
      if (stationsPromise) return stationsPromise;
      stationsPromise = (async () => {
        try {
          const raw = localStorage.getItem(TIDE_STATIONS_KEY);
          if (raw) {
            const o = JSON.parse(raw);
            if (
              o?.ts &&
              Date.now() - o.ts < 7 * 86400000 &&
              Array.isArray(o.list) &&
              o.list.length > 50
            ) {
              return o.list;
            }
          }
        } catch (_) {}

        const list = await fetchStationsFromNetwork();
        try {
          localStorage.setItem(
            TIDE_STATIONS_KEY,
            JSON.stringify({ ts: Date.now(), list })
          );
        } catch (_) {
          /* quota — in-memory only this session */
        }
        return list;
      })().catch((err) => {
        stationsPromise = null;
        throw err;
      });
      return stationsPromise;
    }

    function nearestTideStation(list, lat, lon) {
      let best = null;
      let bestD = Infinity;
      for (let i = 0; i < list.length; i++) {
        const s = list[i];
        const d = haversineKm(lat, lon, s.lat, s.lng);
        if (d < bestD) {
          bestD = d;
          best = s;
        }
      }
      return best ? { station: best, km: bestD } : null;
    }

    function parseNoaaGmt(t) {
      // "2026-07-19 00:36" as UTC when time_zone=gmt
      if (!t || typeof t !== "string") return null;
      const d = new Date(t.replace(" ", "T") + "Z");
      return Number.isNaN(d.getTime()) ? null : d;
    }

    async function fetchHiloPredictions(stationId, when) {
      // Clamp to a window NOAA will accept (scrub dates far out can fail)
      const now = Date.now();
      let t = when instanceof Date ? when.getTime() : now;
      if (!Number.isFinite(t)) t = now;
      const maxPast = now - 20 * 86400000;
      const maxFuture = now + 40 * 86400000;
      t = Math.min(maxFuture, Math.max(maxPast, t));
      const start = new Date(t - 6 * 3600000);
      const end = new Date(t + 48 * 3600000);
      const begin = ymdCompact(start);
      const endStr = ymdCompact(end);

      async function parsePredictions(res) {
        if (!res.ok) throw new Error("predictions failed");
        const data = await res.json();
        if (data?.error?.message) throw new Error(data.error.message);
        if (data?.message === "Forbidden") throw new Error("predictions forbidden");
        if (!Array.isArray(data.predictions)) throw new Error("no predictions");
        return data.predictions;
      }

      // 1) Proxy
      try {
        const res = await fetch(
          `${NOAA_HILO_PROXY}?` +
            new URLSearchParams({
              station: stationId,
              begin,
              end: endStr,
            }).toString()
        );
        return await parsePredictions(res);
      } catch (_) {}

      // 2) Direct (may 403 in some environments)
      const res = await fetch(
        `${NOAA_HILO_DIRECT}?` +
          new URLSearchParams({
            product: "predictions",
            application: "supermoon-app",
            begin_date: begin,
            end_date: endStr,
            datum: "MLLW",
            station: stationId,
            time_zone: "gmt",
            units: "english",
            interval: "hilo",
            format: "json",
          }).toString()
      );
      return parsePredictions(res);
    }

    function nextExtremes(predictions, when) {
      let nextH = null;
      let nextL = null;
      const t0 = when.getTime();
      for (const p of predictions) {
        const dt = parseNoaaGmt(p.t);
        if (!dt || dt.getTime() < t0 - 60000) continue;
        if (p.type === "H" && !nextH) nextH = dt;
        if (p.type === "L" && !nextL) nextL = dt;
        if (nextH && nextL) break;
      }
      // if nothing after when, take first of each in the window
      if (!nextH || !nextL) {
        for (const p of predictions) {
          const dt = parseNoaaGmt(p.t);
          if (!dt) continue;
          if (p.type === "H" && !nextH) nextH = dt;
          if (p.type === "L" && !nextL) nextL = dt;
        }
      }
      return { nextH, nextL };
    }

    /** Mid-tide ≈ halfway in time between the next high and next low. */
    function midTideBetween(nextH, nextL) {
      if (!(nextH instanceof Date) || !(nextL instanceof Date)) return null;
      const a = nextH.getTime();
      const b = nextL.getTime();
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      return new Date((a + b) / 2);
    }

    /** e.g. "Rhems, Black Mingo Creek, SC" — normalize spaces; shorten long multi-part names */
    function formatTideStationLabel(st) {
      if (!st) return "—";
      let name = (st.name || st.id || "").trim().replace(/\s+/g, " ");
      name = name.replace(/\s*,\s*/g, ", ");
      const state = (st.state || "").trim().toUpperCase();
      let label = name;
      if (name && state) {
        const re = new RegExp(`,\\s*${state}$`, "i");
        label = re.test(name) ? name : `${name}, ${state}`;
      } else {
        label = name || st.id || "—";
      }
      // Phone cells are narrow: "Place, Long Creek Name, ST" → "Place, ST"
      const parts = label.split(", ").filter(Boolean);
      if (parts.length >= 3 && label.length > 22) {
        const last = parts[parts.length - 1];
        label = `${parts[0]}, ${last}`;
      }
      return label;
    }

    function paintTideFields({ station, title, high, mid, low }, seq) {
      if (seq !== tideSeq) return;
      if (station != null) {
        el.station.textContent = station;
        if (title != null) el.station.title = title;
      }
      if (high != null) el.htide.textContent = high;
      if (mid != null) el.mtide.textContent = mid;
      if (low != null) el.ltide.textContent = low;
    }

    /** Nearest coastal NOAA station → name + next high/mid/low. */
    async function updateTidesNow(lat, lon, when) {
      const seq = ++tideSeq;
      if (!Number.isFinite(lat) || !Number.isFinite(lon) || !(when instanceof Date)) {
        paintTideFields({ station: "—", high: "—", mid: "—", low: "—" }, seq);
        return;
      }

      // Keep previous station visible while refreshing (no flash to … / —)
      if (!lastTideStationLabel) {
        paintTideFields({ station: "…", high: "…", mid: "…", low: "…" }, seq);
      } else {
        paintTideFields({ high: "…", mid: "…", low: "…" }, seq);
      }

      try {
        const list = await loadTideStations();
        if (seq !== tideSeq) return;
        const near = nearestTideStation(list, lat, lon);
        if (!near?.station) {
          // Only clear if we never had a good label
          if (!lastTideStationLabel) {
            paintTideFields({ station: "—", high: "—", mid: "—", low: "—" }, seq);
          } else {
            paintTideFields({ high: "—", mid: "—", low: "—" }, seq);
          }
          return;
        }
        const place = formatTideStationLabel(near.station);
        const fullName = (() => {
          let n = (near.station.name || "").trim().replace(/\s+/g, " ").replace(/\s*,\s*/g, ", ");
          const st = (near.station.state || "").trim().toUpperCase();
          if (n && st && !new RegExp(`,\\s*${st}$`, "i").test(n)) n = `${n}, ${st}`;
          return n || place;
        })();
        lastTideStationLabel = place;
        paintTideFields(
          {
            station: place,
            title: `${fullName} · ${Math.round(near.km)} km away`,
          },
          seq
        );

        try {
          const preds = await fetchHiloPredictions(near.station.id, when);
          if (seq !== tideSeq) return;
          const { nextH, nextL } = nextExtremes(preds, when);
          const mid = midTideBetween(nextH, nextL);
          paintTideFields(
            {
              high: fmtTime(nextH),
              mid: fmtTime(mid),
              low: fmtTime(nextL),
            },
            seq
          );
        } catch (_) {
          paintTideFields({ high: "—", mid: "—", low: "—" }, seq);
        }
      } catch (_) {
        if (seq !== tideSeq) return;
        if (!lastTideStationLabel) {
          paintTideFields({ station: "—", high: "—", mid: "—", low: "—" }, seq);
        } else {
          // Keep last good station; only times fail
          paintTideFields(
            { station: lastTideStationLabel, high: "—", mid: "—", low: "—" },
            seq
          );
        }
      }
    }

    /** Debounce: goLive/onPhase often fire twice back-to-back */
    function updateTides(lat, lon, when) {
      if (tideTimer) clearTimeout(tideTimer);
      tideTimer = setTimeout(() => {
        tideTimer = 0;
        updateTidesNow(lat, lon, when);
      }, 80);
    }

    function saveLoc(lat, lon, source) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ lat, lon, source }));
      } catch (_) {}
    }

    function loadSavedLoc() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (!Number.isFinite(o.lat) || !Number.isFinite(o.lon)) return null;
        return o;
      } catch (_) {
        return null;
      }
    }

    let surfaceAnchor = {
      t: Date.parse("2026-10-08T12:00:00Z"),
      l0: 263,
      rotationDays: ROTATION_DAYS,
    };

    function l0Degrees(date) {
      const days = (date.getTime() - surfaceAnchor.t) / 86400000;
      const rate = 360 / (surfaceAnchor.rotationDays || ROTATION_DAYS);
      return (((surfaceAnchor.l0 - rate * days) % 360) + 360) % 360;
    }

    function livePhase01(date = new Date()) {
      return ((360 - l0Degrees(date)) % 360) / 360;
    }

    /** phase 0 = start of this Carrington rotation, phase 1 = the next. */
    function dateFromCyclePhase(targetPhase, refDate = new Date()) {
      const p = Math.min(1, Math.max(0, Number(targetPhase) || 0));
      const phaseNow = livePhase01(refDate);
      const startMs = refDate.getTime() - phaseNow * ROTATION_DAYS * 86400000;
      return new Date(startMs + p * ROTATION_DAYS * 86400000);
    }

    function angArcminFromDistKm(distKm) {
      if (!(distKm > 0)) return NaN;
      return ((2 * Math.atan(SUN_RADIUS_KM / distKm) * 180) / Math.PI) * 60;
    }

    function yearMaxAngular(A, when) {
      const yr = when.getFullYear();
      if (yearMaxCache && yearMaxCache.yr === yr) return yearMaxCache.maxAng;
      try {
        const start = new Date(Date.UTC(yr, 0, 1));
        const end = new Date(Date.UTC(yr + 1, 0, 1));
        let apsis = A.SearchPlanetApsis(A.Body.Earth, start);
        let minAu = Infinity;
        for (let i = 0; i < 8; i++) {
          if (!apsis || apsis.time.date >= end) break;
          if (apsis.kind === 0 || apsis.kind === "Pericenter") {
            minAu = Math.min(minAu, apsis.dist_au);
          }
          apsis = A.NextPlanetApsis(apsis);
        }
        const maxAng = Number.isFinite(minAu) && minAu > 0 && minAu < 2
          ? angArcminFromDistKm(minAu * A.KM_PER_AU)
          : AVG_ANG_ARCMIN * 1.017;
        yearMaxCache = { yr, maxAng };
        return maxAng;
      } catch (_) {
        return AVG_ANG_ARCMIN * 1.017;
      }
    }

    function computeMetrics(info) {
      const A = globalThis.Astronomy;
      if (!A || !info) return null;
      const when = info.when instanceof Date ? info.when : new Date(info.when);
      const lat = Number(info.lat);
      const lon = Number(info.lon);
      const phase01 = Number(info.phase01);
      let alt = NaN;
      let az = NaN;
      let distKm = NaN;
      let ang = NaN;
      try {
        const time = A.MakeTime(when);
        const vec = A.GeoVector(A.Body.Sun, time, true);
        distKm = Math.hypot(vec.x, vec.y, vec.z) * A.KM_PER_AU;
        ang = angArcminFromDistKm(distKm);
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
          const obs = new A.Observer(lat, lon, 0);
          const eq = A.Equator(A.Body.Sun, time, obs, true, true);
          const hor = A.Horizon(time, obs, eq.ra, eq.dec, "normal");
          alt = hor.altitude;
          az = hor.azimuth;
        }
      } catch (_) {}

      let hoursToSet = NaN;
      let rise = null;
      let high = null;
      let set = null;
      try {
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
          const obs = new A.Observer(lat, lon, 0);
          const setEv = A.SearchRiseSet(A.Body.Sun, obs, -1, when, 2);
          if (setEv) {
            set = setEv;
            hoursToSet = (setEv.date.getTime() - when.getTime()) / 3600000;
            const riseStart = new Date(setEv.date.getTime() - 36 * 3600000);
            const riseEv = A.SearchRiseSet(A.Body.Sun, obs, +1, riseStart, 2);
            if (riseEv && riseEv.date < setEv.date) {
              rise = riseEv;
              const tr = A.SearchHourAngle(A.Body.Sun, obs, 0, riseEv.date, +1);
              if (tr && tr.time && tr.time.date <= setEv.date) high = tr;
            }
          }
        }
      } catch (_) {}

      const vsAvg = Number.isFinite(ang) ? ((ang - AVG_ANG_ARCMIN) / AVG_ANG_ARCMIN) * 100 : NaN;
      const maxAng = yearMaxAngular(A, when);
      const vsMax = Number.isFinite(ang) && maxAng > 0 ? (ang / maxAng) * 100 : NaN;
      return {
        alt,
        az,
        phase01,
        cycleDay: (Number.isFinite(phase01) ? phase01 : livePhase01(when)) * ROTATION_DAYS,
        hoursToSet,
        distAu: distKm / A.KM_PER_AU,
        ang,
        vsAvg,
        vsMax,
        rise: rise ? rise.date : null,
        high: high && high.time ? high.time.date : null,
        set: set ? set.date : null,
        when,
      };
    }

    let weather = { flare: "—", kp: "—", wind: "—", flux: "—" };
    let weatherAt = 0;

    function paintWeather() {
      el.station.textContent = weather.flare;
      el.htide.textContent = weather.kp;
      el.mtide.textContent = weather.wind;
      el.ltide.textContent = weather.flux;
    }

    function lastRow(data) {
      return Array.isArray(data) && data.length ? data[data.length - 1] : null;
    }

    async function updateSpaceWeather(force) {
      if (!force && Date.now() - weatherAt < 60000) {
        paintWeather();
        return;
      }
      weatherAt = Date.now();
      try {
        const [flare, kp, wind, flux] = await Promise.all([
          fetch("https://services.swpc.noaa.gov/json/goes/primary/xray-flares-latest.json").then((r) => r.json()),
          fetch("https://services.swpc.noaa.gov/json/planetary_k_index_1m.json").then((r) => r.json()),
          fetch("https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json").then((r) => r.json()),
          fetch("https://services.swpc.noaa.gov/products/summary/10cm-flux.json").then((r) => r.json()),
        ]);
        const f = lastRow(flare) || flare;
        const k = lastRow(kp);
        const w = lastRow(wind);
        const x = lastRow(flux);
        if (f && f.current_class) weather.flare = String(f.current_class);
        if (k && Number.isFinite(Number(k.estimated_kp))) weather.kp = Number(k.estimated_kp).toFixed(2);
        if (w && Number.isFinite(Number(w.proton_speed))) weather.wind = `${Math.round(w.proton_speed)} km/s`;
        if (x && Number.isFinite(Number(x.flux))) weather.flux = String(Math.round(x.flux));
      } catch (_) {}
      paintWeather();
    }

    async function updateRegions() {
      try {
        const rows = await fetch("https://services.swpc.noaa.gov/json/solar_regions.json").then((r) => r.json());
        if (!Array.isArray(rows) || !rows.length) return;
        const day = rows.reduce((a, r) => (String(r.observed_date || "") > a ? String(r.observed_date) : a), "");
        const byId = new Map();
        for (const r of rows) {
          if (String(r.observed_date || "") !== day) continue;
          if (r.latitude == null || r.carrington_longitude == null) continue;
          const prev = byId.get(r.region);
          const spots = Number(r.number_spots) || 0;
          if (!prev || spots > (Number(prev.number_spots) || 0)) byId.set(r.region, r);
        }
        const sites = [...byId.values()].map((r) => {
          const spots = Number(r.number_spots) || 0;
          const parts = [r.location, r.spot_class, spots ? `${spots} spots` : ""].filter(Boolean);
          return {
            id: `ar${r.region}`,
            name: `AR ${r.region}`,
            lat: r.latitude,
            lon: r.carrington_longitude,
            famous: spots >= 5,
            meta: parts.join(" · "),
            blurb: `Active region on the Earth-facing side, ${day}. Carrington longitude ${r.carrington_longitude}.`,
          };
        });
        if (sites.length && !sites.some((s) => s.famous)) {
          sites.forEach((s) => {
            s.famous = true;
          });
        }
        globe.setRegions(sites);
      } catch (_) {}
    }

    function paintMetrics(info) {
      const m = computeMetrics(info);
      if (!m) return;
      if (!previewMode && Number.isFinite(m.phase01)) syncSliderToPhase01(m.phase01);
      el.phase.textContent = Number.isFinite(m.alt) ? `${Math.round(m.alt)}°` : "—";
      el.illum.textContent = Number.isFinite(m.az) ? `${Math.round(m.az)}°` : "—";
      el.cycle.textContent = `${m.cycleDay.toFixed(1)}/${ROTATION_DAYS.toFixed(1)}`;
      el.tofull.textContent = Number.isFinite(m.hoursToSet) ? `${m.hoursToSet.toFixed(1)} hr` : "—";
      el.dist.textContent = Number.isFinite(m.distAu) ? `${m.distAu.toFixed(3)} AU` : "—";
      el.ang.textContent = Number.isFinite(m.ang) ? `${m.ang.toFixed(1)}′` : "—";
      if (Number.isFinite(m.vsAvg)) {
        const s = m.vsAvg >= 0 ? "+" : "";
        el.vsavg.textContent = `${s}${m.vsAvg.toFixed(1)}%`;
      } else el.vsavg.textContent = "—";

    function goLive() {
      previewMode = false;
      try {
        if (typeof closeLocationDialog === "function") closeLocationDialog();

      const now = new Date();
      let info = null;
      try {
        info = globe.setTime(now, { lockOrient: false });

      } catch (err) {
        console.warn("goLive setTime/resetView", err);

      // Prefer ephemeris phase (same source as “Cycle day”) so thumb matches
      const p =
        info && Number.isFinite(info.phase01)
          ? info.phase01

      syncSliderToPhase01(p);
      showPhase(info || globe.getPhaseInfo());
      setLiveUI();
    }

    function requestUserLocation({ force = false } = {}) {
      if (!navigator.geolocation) {

    function pwaFillHeightPx() {
      const iw = window.innerWidth || 0;
      const ih = window.innerHeight || 0;
      const sw = window.screen.width || 0;
      const sh = window.screen.height || 0;
      // iOS keeps screen.* in portrait metrics; pick the axis for current height.
      if (ih >= iw) return Math.max(ih, Math.max(sw, sh));
      return Math.max(ih, Math.min(sw, sh));
    }

    /** iPad PWA: screen.* undershoots CSS inner — phone uses screen height instead. */
    function pwaExtraBottomPx() {
      const iw = window.innerWidth || 0;
      const ih = window.innerHeight || 0;
      const sw = window.screen.width || 0;
      const sh = window.screen.height || 0;
      const screenMax = Math.max(sw, sh);
      if (Math.min(iw, ih) < 600) return 0;
      if (screenMax >= ih - 10) return 0;
      return Math.max(readSafeInsetBottom(), 20);
    }

    function syncPwaFillHeight() {
      const root = document.documentElement;
      if (!root.classList.contains("pwa-standalone")) {
        root.style.removeProperty("--pwa-fill-h");
        root.style.removeProperty("--pwa-extra-b");
        return 0;
      }
      const fillH = pwaFillHeightPx();
      const extra = pwaExtraBottomPx();
      root.style.setProperty("--pwa-fill-h", `${fillH}px`);
      root.style.setProperty("--pwa-extra-b", `${extra}px`);
      return fillH + extra;
    }

    function readSafeInsetBottom() {
      const probe = document.createElement("div");
      probe.style.cssText =
        "position:fixed;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom,0px)";
      document.body.appendChild(probe);
      const px = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
      probe.remove();
      return px;
    }

    function onResize() {
      syncPwaFillHeight();
      globe.fitToHost();

    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", () => {
      setTimeout(onResize, 50);

    window.visualViewport?.addEventListener("resize", onResize);
